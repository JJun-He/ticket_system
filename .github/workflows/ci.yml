name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_system_test
          POSTGRES_USER: ticket_test_user
          POSTGRES_PASSWORD: ticket_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test_user -d ticket_system_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev
