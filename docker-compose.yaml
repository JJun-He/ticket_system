services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_system
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - '5433:5432'
    volumes:
      - ticket_system_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket_user -d ticket_system']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: ticket-system:local
    command: ['npm', 'run', 'migration:run:prod']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticket_system
      DB_USER: ticket_user
      DB_PASSWORD: ticket_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    image: ticket-system:local
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticket_system
      DB_USER: ticket_user
      DB_PASSWORD: ticket_password
      DB_POOL_MAX: 10
      DB_CONNECTION_TIMEOUT_MS: 3000
      DB_IDLE_TIMEOUT_MS: 10000
      DB_STATEMENT_TIMEOUT_MS: 5000
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: 10000
      DB_APPLICATION_NAME: ticket-system
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 100
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/db').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  ticket_system_pgdata:
