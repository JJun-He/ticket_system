name: ticket-system-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_system_test
      POSTGRES_USER: ticket_test_user
      POSTGRES_PASSWORD: ticket_test_password
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ticket_test_user -d ticket_system_test']
      interval: 2s
      timeout: 3s
      retries: 20
